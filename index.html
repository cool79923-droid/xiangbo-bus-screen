<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="祥波书院校巴到站信息可视化系统前端演示"
    />
    <title>祥波书院校巴到站信息</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1830'/%3E%3Cpath d='M15 18h34v25H15z' fill='%231ed7c4'/%3E%3Cpath d='M20 23h10v9H20zm14 0h10v9H34z' fill='%230a1830'/%3E%3Ccircle cx='23' cy='45' r='5' fill='%23f6b94a'/%3E%3Ccircle cx='42' cy='45' r='5' fill='%23f6b94a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="screen-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 52 52" role="img">
              <rect x="7" y="10" width="38" height="28" rx="6"></rect>
              <path d="M14 17h10v9H14zm14 0h10v9H28z"></path>
              <circle cx="17" cy="40" r="5"></circle>
              <circle cx="36" cy="40" r="5"></circle>
            </svg>
          </span>
          <div>
            <h1>祥波书院校巴到站信息</h1>
            <p>Xiangbo College · Shuttle arrivals</p>
          </div>
        </div>

        <div class="header-meta">
          <div class="service-panel" aria-label="服务状态">
            <span class="status-dot" aria-hidden="true"></span>
            <div>
              <strong>模拟数据 · 系统正常</strong>
              <span>Demo data · Service normal</span>
            </div>
          </div>
          <div class="clock-block">
            <time id="current-time" class="current-time">--:--:--</time>
            <p id="current-date">----年--月--日</p>
          </div>
        </div>
      </header>

      <section class="station-strip" aria-label="上车站点与步行信息">
        <div class="station-main">
          <div class="section-icon pin-icon" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">上车站点 · Boarding point</p>
            <h2>书院站</h2>
          </div>
        </div>
        <div class="walk-info">
          <p class="eyebrow">参考步行 · Walking</p>
          <div class="walk-value"><strong>6</strong><span>分钟<br /><small>min</small></span></div>
        </div>
        <div class="update-info">
          <p class="eyebrow">更新时间 · Updated</p>
          <strong id="last-updated">--:--</strong>
          <span>每分钟自动刷新</span>
        </div>
      </section>

      <section class="routes-section" aria-labelledby="routes-title">
        <h2 id="routes-title" class="visually-hidden">校巴到站线路</h2>
        <div id="route-list" class="route-list" aria-live="polite"></div>
      </section>

      <footer class="screen-footer">
        <p><span>信息提示</span> 到站时间仅供演示，请以现场实际运营信息为准。</p>
        <p>Demo only · Arrival times are simulated</p>
      </footer>
    </main>

    <script src="mockData.js"></script>
    <script src="app.js"></script>
  </body>
</html>
